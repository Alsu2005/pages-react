<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Перенаправление...</title>
    <script>
      // Получаем путь, который запрашивал пользователь
      var path = window.location.pathname;
      // Убираем из пути часть /pages-react/ если она есть
      var newPath = path.replace(/^\/pages-react/, '');
      // Перенаправляем на index.html с этим путём в hash
      window.location.href = '/pages-react/#' + newPath;
    </script>
  </head>
  <body>
    <p>Перенаправление...</p>
  </body>
</html>
